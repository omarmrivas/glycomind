[project]
name = "glycomind"
version = "0.1.0"
description = "Pipeline determinista comida <-> respuesta glucemica (Fase 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "numpy>=2.1.0",
    "typer>=0.15.1",
    "rich>=13.9.0",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "tzdata>=2024.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
]

[project.scripts]
glycomind = "glycomind.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.122.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "httpx>=0.28.1",
    "alembic>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glycomind"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Las revisiones de Alembic son autogeneradas: formatearlas produce ruido en los diffs.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer usa llamadas en defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["db: requiere PostgreSQL"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
