# Catalogo semilla de alimentos de consumo habitual en Mexico.
#
# IMPORTANTE — que hay y que NO hay aqui:
#
#   * SI: identidades, alias (incluidos plurales y regionalismos), categoria,
#     descomposicion de platillos en ingredientes, y una porcion por defecto.
#   * NO: valores de macronutrientes. Los macros se importan de FoodData Central con
#     su ``fdc_query`` y quedan registrados con fuente y referencia en food_nutrient.
#     Escribirlos a mano seria inventar datos nutricionales.
#
# ``default_portion_g`` es un PUNTO DE PARTIDA, no una medicion. Se sobreescribe por
# usuario en user_food_portion en cuanto haya una porcion calibrada: contar objetos
# discretos ("2 tortillas") es mucho mas fiable que estimar volumen.

